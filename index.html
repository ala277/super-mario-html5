<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>لعبة سوبر ماريو</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <h1 class="game-title">🎮 لعبة سوبر ماريو 🎮</h1>
    <div class="score-board">
      <div class="score">النقاط: <span id="score">0</span></div>
      <div class="coins">العملات: <span id="coins">0</span></div>
      <div class="level">المستوى: <span id="level">1</span>/7</div>
    </div>
    <canvas id="gameCanvas" width="800" height="400" aria-label="لعبة ماريو"></canvas>
    <div class="mobile-controls" aria-label="أزرار التحكم للهاتف">
      <div class="move-controls">
        <button class="touch-btn" id="leftBtn" aria-label="تحرك يساراً">◀</button>
        <button class="touch-btn" id="rightBtn" aria-label="تحرك يميناً">▶</button>
      </div>
      <button class="touch-btn jump-btn" id="jumpBtn" aria-label="قفز">قفز</button>
    </div>
    <section class="controls-info">
      <h2>🎮 التحكم</h2>
      <p>الهاتف: استخدم أزرار اليمين واليسار والقفز</p>
      <p>الكمبيوتر: الأسهم أو A/D — القفز بمفتاح SPACE</p>
    </section>
    <div class="buttons-container">
      <button id="startBtn" class="btn btn-start">▶️ ابدأ اللعبة</button>
      <button id="pauseBtn" class="btn btn-pause" disabled>⏸️ إيقاف مؤقت</button>
      <button id="resumeBtn" class="btn btn-resume" hidden>▶️ استئناف</button>
      <button id="resetBtn" class="btn btn-reset">🔄 إعادة تعيين</button>
      <button id="nextBtn" class="btn btn-restart">🔁 المستوى التالي</button>
    </div>
    <div class="game-stats">
      <span class="stat-label">الحالة:</span><strong id="gameStatus" class="stat-value">جاهزة</strong>
      <span class="stat-label">المطلوب:</span><strong id="coinsNeeded" class="stat-value">4</strong>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
